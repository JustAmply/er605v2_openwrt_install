[project]
name = "er605-host-installer"
version = "0.1.0"
description = "Guarded host-side installer for TP-Link ER605 v2 OpenWrt migration"
requires-python = ">=3.11"

[project.scripts]
er605-installer = "er605_installer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["er605_installer*"]
